[project]
name = "back-joeleeli"
version = "0.1.0"
description = "API backend for wedding guest management and check-in"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "django>=5.2,<5.3",
    "django-cors-headers>=4.7,<5",
    "django-environ>=0.12,<0.13",
    "djangorestframework>=3.16,<3.17",
    "drf-spectacular>=0.28,<0.29",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.11,<0.15",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
